apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-replicaset
  namespace: default
spec:
  project: default
  sources:
    - repoURL: https://github.com/simzacks/sample-nodejs.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/simzacks/sample-nodejs.git
      targetRevision: main
      path: gitops/workloads/mongodb/manifests
    # Full OCI chart URL. A separate chart: field is not appended to an oci:// repoURL.
    # 16.5.45 is the last chart whose appVersion is MongoDB 8.0.13.
    - repoURL: oci://registry-1.docker.io/bitnamicharts/mongodb
      path: .
      targetRevision: 16.5.45
      helm:
        valueFiles:
          - $values/gitops/workloads/mongodb/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
