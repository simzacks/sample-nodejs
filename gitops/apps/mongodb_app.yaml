apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-replicaset
  namespace: default
spec:
  project: default
  sources:
    - repoURL: https://github.com/simzacks/sample-nodejs.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/simzacks/sample-nodejs.git
      targetRevision: main
      path: gitops/workloads/mongodb/manifests
    - chart: mongodb
      repoURL: oci://registry-1.docker.io/bitnamicharts
      # 17.0.2 is no longer published; 16.5.0 is the last 8.x chart line. Image tag pins 8.0.13.
      targetRevision: 16.5.0
      helm:
        valueFiles:
          - $values/gitops/workloads/mongodb/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
