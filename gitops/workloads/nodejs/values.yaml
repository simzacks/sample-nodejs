replicaCount: 2

image:
  repository: ghcr.io/simzacks/sample-nodejs
  tag: "1.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Dedicated ServiceAccount. The app never calls the Kubernetes API, so no API token is mounted.
serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

# The image uses the distroless "nonroot" user. runAsUser must be numeric: with a named
# image user (USER nonroot) the kubelet cannot verify runAsNonRoot and refuses to start the pod.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Replace pods one at a time and never drop below the desired replica count.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Keep replicas on different nodes so one node failure does not take the app down.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

# Limits voluntary disruptions (node drains, upgrades). Only rendered when replicaCount > 1.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

service:
  type: ClusterIP

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.tls: "false"
  # Empty host: Traefik matches any Host. Reach the app at app.<lb-ip>.sslip.io
  # (terraform output app_access). Set a hostname here only to pin a specific name.
  hostname: ""
  path: /
  pathType: Prefix

config:
  PORT: "8080"
  NODE_ENV: production

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /live
    initialDelaySeconds: 10
    periodSeconds: 20
