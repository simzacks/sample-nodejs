replicaCount: 2

image:
  repository: ghcr.io/simzacks/sample-nodejs
  tag: "1.0.2"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.tls: "false"
  # Empty host: Traefik matches any Host. Reach the app at app.<lb-ip>.sslip.io
  # (terraform output app_access). Set a hostname here only to pin a specific name.
  hostname: ""
  path: /
  pathType: Prefix

config:
  PORT: "8080"
  NODE_ENV: production

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /live
    initialDelaySeconds: 10
    periodSeconds: 20
