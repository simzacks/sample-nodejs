architecture: replicaset
replicaCount: 3

image:
  # 8.0.13 was removed from bitnami/mongodb; the same tag is on bitnamilegacy.
  repository: bitnamilegacy/mongodb
  tag: 8.0.13-debian-12-r0

auth:
  enabled: true
  # Created by sample-infra from random_password.
  existingSecret: mongodb-credentials
  usernames:
    - appuser
  databases:
    - mydatabase

externalAccess:
  enabled: true
  autoDiscovery:
    enabled: true
    # This is for a sidecar with no real compute. I gave it a very small footprint.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  service:
    type: NodePort
    # Cluster so every node accepts every member port. Local would only answer on the node running that pod.
    externalTrafficPolicy: Cluster
    # Must have one port for each pod in the replica-set (replicasCount:3 requires 3 ports).
    nodePorts:
      - 30017
      - 30018
      - 30019

# The standard setup.sh in the bitnami chart sets MONGODB_ADVERTISED_HOSTNAME to 
# the private IP when externalAccess.service.domain is empty. This uses the ConfigMap
# generated by Terraform to populate the external domain before running the chart script.
command:
  - /bin/bash
  - -ec
args:
  - |
    set -euo pipefail
    DOMAIN="$(tr -d '[:space:]' < /etc/mongodb-external/domain)"
    if [ -z "$DOMAIN" ]; then
      echo "mongodb-external-access ConfigMap has an empty domain" >&2
      exit 1
    fi
    # Verifies that the bitnami chart contains the expected line item that this is overriding.
    if ! grep -q 'export MONGODB_ADVERTISED_HOSTNAME=$MY_POD_HOST_IP' /scripts/setup.sh; then
      echo "setup.sh does not advertise the node private IP; refusing to start" >&2
      exit 1
    fi
    #
    sed "s|export MONGODB_ADVERTISED_HOSTNAME=\$MY_POD_HOST_IP|export MONGODB_ADVERTISED_HOSTNAME=${DOMAIN}|" /scripts/setup.sh > /tmp/setup.sh
    chmod +x /tmp/setup.sh
    exec /tmp/setup.sh
extraVolumes:
  - name: mongodb-external-access
    configMap:
      name: mongodb-external-access
extraVolumeMounts:
  - name: mongodb-external-access
    mountPath: /etc/mongodb-external
    readOnly: true

rbac:
  create: true
# Pod token. serviceAccount.automountServiceAccountToken only sets the field on the
# ServiceAccount; the chart refuses to render externalAccess + autoDiscovery without this.
automountServiceAccountToken: true
serviceAccount:
  create: true
  automountServiceAccountToken: true
# The mongodb minimum is 1GB of memory, I gave it 1.25 for some breathing room. 
# Memory should not be burstable for a DB (or other critical infra component) as it will become a
# first target for the scheduler to kill if it needs to free up memory.
# The CPU can be burstable, without as it generally only needs the extra CPU on spikes and indexing operations.
# This does not make it a candidate for process killing.
resources:
  requests:
    cpu: 250m
    memory: 1280Mi
  limits:
    cpu: 1000m
    memory: 1280Mi

persistence:
  enabled: false
arbiter:
  enabled: false

metrics:
  enabled: true
  image:
    repository: bitnamilegacy/mongodb-exporter