architecture: replicaset
replicaCount: 3

image:
  # 8.0.13 was removed from bitnami/mongodb; the same tag is on bitnamilegacy.
  repository: bitnamilegacy/mongodb
  tag: 8.0.13-debian-12-r0

auth:
  enabled: true
  existingSecret: mongodb-credentials
  usernames:
    - appuser
  databases:
    - mydatabase

externalAccess:
  enabled: true
  autoDiscovery:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  service:
    type: NodePort

rbac:
  create: true
# Pod token. serviceAccount.automountServiceAccountToken only sets the field on the
# ServiceAccount; the chart refuses to render externalAccess + autoDiscovery without this.
automountServiceAccountToken: true
serviceAccount:
  create: true
  automountServiceAccountToken: true

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: false
arbiter:
  enabled: false

metrics:
  enabled: true
  image:
    repository: bitnamilegacy/mongodb-exporter