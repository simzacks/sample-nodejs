architecture: replicaset
replicaCount: 3

image:
  # 8.0.13 was removed from bitnami/mongodb; the same tag is on bitnamilegacy.
  repository: bitnamilegacy/mongodb
  tag: 8.0.13-debian-12-r0

auth:
  enabled: true
  existingSecret: mongodb-credentials
  usernames:
    - appuser
  databases:
    - mydatabase

externalAccess:
  enabled: true
  autoDiscovery:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  service:
    type: NodePort
    # Cluster so every node accepts every member port. Local would only answer on the node running that pod.
    externalTrafficPolicy: Cluster
    # domain is intentionally unset here. Terraform stores the load balancer IPv4 in
    # the mongodb-external-access ConfigMap. The PreSync hook copies it onto this
    # Application and fails that sync, so the pods are created only after that address
    # is set. An empty domain advertises the node private IP. A hostname is not used:
    # sslip.io publishes an IPv6 address that does not reach the load balancer.
    nodePorts:
      - 30017
      - 30018
      - 30019

rbac:
  create: true
# Pod token. serviceAccount.automountServiceAccountToken only sets the field on the
# ServiceAccount; the chart refuses to render externalAccess + autoDiscovery without this.
automountServiceAccountToken: true
serviceAccount:
  create: true
  automountServiceAccountToken: true

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: false
arbiter:
  enabled: false

metrics:
  enabled: true
  image:
    repository: bitnamilegacy/mongodb-exporter