apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-set-domain
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-set-domain
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["mongodb-external-access"]
    verbs: ["get"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["mongodb-replicaset"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-set-domain
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-set-domain
subjects:
  - kind: ServiceAccount
    name: mongodb-set-domain
    namespace: default
---
# Runs before MongoDB manifests are applied. Terraform stores the load balancer
# hostname in the mongodb-external-access ConfigMap. This hook copies it onto the
# Application and fails the sync so that attempt cannot initiate the replica set.
# The failed attempt's sources no longer match the spec, so automated sync starts
# a new one that renders the public hostname before the pods are created.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-set-domain
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: mongodb-set-domain
      restartPolicy: Never
      containers:
        - name: set-domain
          image: docker.io/bitnamilegacy/kubectl:1.33.4-debian-12-r0
          command: ["/bin/bash", "-ec"]
          args:
            - |
              set -euo pipefail
              DOMAIN=""
              for _ in $(seq 1 90); do
                DOMAIN=$(kubectl get configmap mongodb-external-access -n default -o jsonpath='{.data.domain}' 2>/dev/null || true)
                if [ -n "$DOMAIN" ]; then
                  break
                fi
                sleep 2
              done
              if [ -z "$DOMAIN" ]; then
                echo "mongodb-external-access ConfigMap has no domain yet"
                exit 1
              fi
              CURRENT=$(kubectl get application mongodb-replicaset -n default -o jsonpath='{.spec.sources[2].helm.parameters[?(@.name=="externalAccess.service.domain")].value}')
              if [ "$CURRENT" = "$DOMAIN" ]; then
                exit 0
              fi
              if [ -z "$(kubectl get application mongodb-replicaset -n default -o jsonpath='{.spec.sources[2].helm.parameters}')" ]; then
                OP=add
              else
                OP=replace
              fi
              kubectl patch application mongodb-replicaset -n default --type=json --patch="[{\"op\":\"${OP}\",\"path\":\"/spec/sources/2/helm/parameters\",\"value\":[{\"name\":\"externalAccess.service.domain\",\"value\":\"${DOMAIN}\"}]}]"
              echo "Set externalAccess.service.domain to ${DOMAIN}. Failing this sync so MongoDB is created on the next one."
              exit 1
