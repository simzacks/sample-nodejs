name: Build image

on:
  push:
    branches: [main]
    paths:
      - app.js
      - package.json
      - package-lock.json
      - Dockerfile
      - .github/workflows/build-image.yml
  pull_request:
    branches: [main]
    paths:
      - app.js
      - package.json
      - package-lock.json
      - Dockerfile
      - .github/workflows/build-image.yml

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      released: ${{ steps.semantic.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.1.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Semantic release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  image:
    name: Build, scan, and push
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: tags
        env:
          RELEASED: ${{ needs.release.outputs.released }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          local_tag="${image}:sha-${GITHUB_SHA}"
          echo "local_tag=${local_tag}" >> "${GITHUB_OUTPUT}"
          {
            echo "push_tags<<EOF"
            echo "${local_tag}"
            if [ "${RELEASED}" = "true" ] && [ -n "${VERSION}" ]; then
              echo "${image}:${VERSION}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.local_tag }}
          cache-to: type=local,dest=/tmp/buildx-cache,mode=max

      - name: Scan image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.local_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Fail on high or critical vulnerabilities
        if: steps.trivy.outcome == 'failure'
        run: exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.tags.outputs.push_tags }}
          cache-from: type=local,src=/tmp/buildx-cache

