name: Build image

on:
  push:
    branches: [main]
    paths:
      - app.js
      - package.json
      - package-lock.json
      - Dockerfile
      - .github/workflows/build-image.yml
  pull_request:
    branches: [main]
    paths:
      - app.js
      - package.json
      - package-lock.json
      - Dockerfile
      - .github/workflows/build-image.yml

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.1.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # Pipeline order: scans -> build + Trivy + push (sha tag) -> release -> promote (version tag) -> gitops.
  # Nothing is tagged, released or deployed unless every scan has passed.
  image:
    name: Build, scan, and push
    needs: [codeql, audit, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=${image}"
            echo "sha_tag=${image}:sha-${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.sha_tag }}
          cache-to: type=local,dest=/tmp/buildx-cache,mode=max

      - name: Scan image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.sha_tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          scanners: vuln
        continue-on-error: true

      - name: Write Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.sha_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          scanners: vuln

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Fail on high or critical vulnerabilities
        if: steps.trivy.outcome == 'failure'
        run: exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.tags.outputs.sha_tag }}
          cache-from: type=local,src=/tmp/buildx-cache

  release:
    name: Release
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      released: ${{ steps.semantic.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.1.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Semantic release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # Adds the version tag to the image that was already built, scanned and pushed.
  # No rebuild: the version tag points at the same digest (and attestations) as the sha tag.
  promote:
    name: Tag image with release version
    needs: [image, release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add version tag
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          SHA_TAG: ${{ needs.image.outputs.sha_tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${SHA_TAG}"

  gitops:
    name: Update Helm tag
    needs: [release, promote]
    if: needs.release.outputs.released == 'true' && needs.promote.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Set image tag and push
        env:
          VERSION: ${{ needs.release.outputs.version }}
          VALUES_FILE: gitops/workloads/nodejs/values.yaml
          CHART_FILE: gitops/workloads/nodejs/Chart.yaml
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          # yq (mikefarah, v4) is preinstalled on ubuntu-latest runners.
          yq -i '.image.tag = strenv(VERSION) | .image.tag style = "double"' "${VALUES_FILE}"
          test "$(yq '.image.tag' "${VALUES_FILE}")" = "${VERSION}"
          # Chart appVersion follows the deployed image tag.
          yq -i '.appVersion = strenv(VERSION) | .appVersion style = "double"' "${CHART_FILE}"
          test "$(yq '.appVersion' "${CHART_FILE}")" = "${VERSION}"
          git add "${VALUES_FILE}" "${CHART_FILE}"
          if git diff --cached --quiet; then
            echo "image tag already set to ${VERSION}"
            exit 0
          fi
          git commit -m "chore(gitops): set image tag to ${VERSION} [skip ci]"
          git push origin HEAD:main
